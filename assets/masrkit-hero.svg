<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MasrKit, build products that feel Egyptian</title>
  <desc id="desc">Dark developer-focused banner with Egyptian flag colors, a stylized flag emblem, and the MasrKit name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d675"/>
      <stop offset="1" stop-color="#c99a2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="flagClip">
      <rect x="86" y="74" width="224" height="150" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1100" cy="-10" r="230" fill="#ce1126" opacity=".08"/>
  <circle cx="80" cy="380" r="220" fill="#f4d675" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="66" y="54" width="264" height="190" rx="28" fill="#fff" opacity=".08"/>
    <g clip-path="url(#flagClip)">
      <rect x="86" y="74" width="224" height="50" fill="#ce1126"/>
      <rect x="86" y="124" width="224" height="50" fill="#fff"/>
      <rect x="86" y="174" width="224" height="50" fill="#000"/>
    </g>
    <g transform="translate(198 149)" fill="url(#gold)">
      <path d="M0-24 10-10 30-15 21 1 37 11 16 13 12 31 0 20-12 31-16 13-37 11-21 1-30-15-10-10Z"/>
      <rect x="-5" y="13" width="10" height="29" rx="3"/>
    </g>
    <text x="198" y="282" text-anchor="middle" fill="#f4d675" font-family="Arial, sans-serif" font-size="22" font-weight="700">مصر • EGYPT</text>
  </g>

  <g transform="translate(390 0)">
    <text x="0" y="132" fill="#f4d675" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">OPEN SOURCE • AGENT SKILLS</text>
    <text x="0" y="205" fill="#fff" font-family="Arial, sans-serif" font-size="72" font-weight="800">MasrKit</text>
    <text x="0" y="254" fill="#d5dbea" font-family="Arial, sans-serif" font-size="28">Build products that feel Egyptian.</text>
    <rect x="0" y="287" width="118" height="5" rx="2.5" fill="#ce1126"/>
    <rect x="126" y="287" width="118" height="5" rx="2.5" fill="#fff"/>
    <rect x="252" y="287" width="118" height="5" rx="2.5" fill="#111" stroke="#3a4353"/>
  </g>
</svg>
